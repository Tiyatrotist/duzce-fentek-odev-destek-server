name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: |
          node --check server.js
          node --check db.js
          node --check anti-bot.js
          node --check spam.js
          node --check kutuphane.js
          node --check oneri.js
          node --check seed.js

      - name: Run automated test suite (59 core + 42 video + 19 library)
        working-directory: backend
        run: npm run test:all

      - name: Run AI moderation evaluation benchmarks
        working-directory: backend
        run: |
          npm run eval
          node ai-eval/bagimsiz-kos.js
          node ai-eval/genis-kos.js
